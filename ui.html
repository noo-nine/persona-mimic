<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Hybrid Interface</title>
    <!-- Styling: Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons: Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar and animations */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-msg { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#f0f2f5] font-sans h-screen flex flex-col">

    <!-- Main Chat Area -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-6 md:p-12 space-y-6 flex flex-col">
        <div class="max-w-4xl w-full mx-auto space-y-6" id="message-list">
            <!-- Messages go here -->
        </div>
    </main>

    <!-- Bottom Input Section -->
    <footer class="bg-white border-t border-slate-200 p-8 shadow-2xl relative">
        <div class="max-w-4xl mx-auto space-y-4">
            
            <!-- File Attached Preview (Hidden by default) -->
                <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i>
                <div class="flex flex-col">
                    <span id="file-name" class="text-[10px] font-bold text-indigo-900 leading-tight"></span>
                    <span id="file-size" class="text-[9px] text-indigo-400 font-medium"></span>
                </div>
                <button onclick="clearFile()" class="ml-2 p-1 hover:bg-indigo-100 rounded-full text-indigo-400">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            </div>

            <!-- Input Bar -->
            <div class="relative flex items-center gap-3">
                <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                
                <button onclick="document.getElementById('file-input').click()" 
                        class="absolute left-4 p-2 hover:bg-slate-100 rounded-lg text-slate-400 transition-colors">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                </button>

                <input type="text" id="user-input" 
                    placeholder="Enter your message..."
                    class="w-full pl-16 pr-32 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 text-sm shadow-inner">
                
                <button onclick="handleSend()" 
                    class="absolute right-2 bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 active:scale-95 transition-all shadow-md shadow-indigo-100">
                    Send
                </button>
            </div>
        </div>
    </footer>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const messageList = document.getElementById('message-list');
        const userInput = document.getElementById('user-input');
        const filePreview = document.getElementById('file-preview');
        const fileNameSpan = document.getElementById('file-name');
        const fileSizeSpan = document.getElementById('file-size');
        
        let attachedFile = null;

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                attachedFile = file;
                fileNameSpan.textContent = file.name;
                fileSizeSpan.textContent = (file.size / 1024).toFixed(1) + ' KB';
                filePreview.classList.remove('hidden');
            }
        }

        function clearFile() {
            attachedFile = null;
            filePreview.classList.add('hidden');
            document.getElementById('file-input').value = '';
        }

        function handleSend() {
            const content = userInput.value.trim();
            if (!content && !attachedFile) return;

            let finalContent = content;
            if (attachedFile) {
                finalContent = `📁 [Data Source: ${attachedFile.name}] \n\n${content}`;
            }

            // 1. Add User Message
            addMessage('user', finalContent);
            
            // Clear inputs
            userInput.value = '';
            clearFile();

            // 2. Simulate AI Response (Connect your backend here)
            setTimeout(() => {
                addMessage('assistant', "I have received your inquiry. My processing engine is analyzing the structural logic of your request.");
            }, 1000);
        }

        function addMessage(role, text) {
            const isUser = role === 'user';
            const isRight = messageList.children.length % 2 === 1;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-5 animate-msg ${isRight ? 'flex-row-reverse' : ''}`;
            
            const borderCol = isUser ? 'border-l-indigo-500' : 'border-l-emerald-500';
            const textCol = isUser ? 'text-indigo-600' : 'text-emerald-500';

            messageDiv.innerHTML = `
                <!-- Identity Tag -->
                <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl border border-slate-200 shadow-sm transition-colors bg-white">
                    <span class="text-xl font-black ${textCol}">${role === 'user' ? 'U' : 'M'}</span>
                </div>
                
                <!-- Card -->
                <div class="flex-1 flex flex-col ${isRight ? 'items-end text-right' : 'items-start text-left'}">
                    <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden border-l-4 ${borderCol}">
                        <div class="px-6 py-5">
                            <p class="text-sm leading-relaxed text-slate-700 font-medium whitespace-pre-wrap">${text}</p>
                        </div>
                    </div>
                </div>
            `;
            
            messageList.appendChild(messageDiv);
            document.getElementById('chat-window').scrollTo({ top: messageList.scrollHeight, behavior: 'smooth' });
        }

        // Handle Enter Key
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Prompt
        addMessage('assistant', "Functional Hybrid UI Loaded. Ready for data intake.");
    </script>
</body>
</html>
