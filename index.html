<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimicry Engine | Persona AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-msg { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#f0f2f5] font-sans h-screen flex flex-col">

    <main id="chat-window" class="flex-1 overflow-y-auto p-6 md:p-12 space-y-6 flex flex-col">
        <div class="max-w-4xl w-full mx-auto space-y-6" id="message-list">
            </div>
    </main>

    <footer class="bg-white border-t border-slate-200 p-8 shadow-2xl relative">
        <div class="max-w-4xl mx-auto space-y-4">
            
            <div id="file-preview" class="hidden flex items-center bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-2 w-fit animate-msg">
                <i data-lucide="file-text" class="w-4 h-4 text-indigo-600 mr-2"></i>
                <div class="flex flex-col mr-4">
                    <span id="file-name" class="text-[10px] font-bold text-indigo-900 leading-tight"></span>
                    <span id="file-size" class="text-[9px] text-indigo-400 font-medium"></span>
                </div>
                <button onclick="clearFile()" class="p-1 hover:bg-indigo-200 rounded-full text-indigo-400 transition-colors">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            </div>

            <div class="relative flex items-center gap-3">
                <input type="file" id="file-input" class="hidden" accept=".txt" onchange="handleFileSelect(event)">
                
                <button onclick="document.getElementById('file-input').click()" 
                        class="absolute left-4 p-2 hover:bg-slate-100 rounded-lg text-slate-400 transition-colors">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                </button>

                <input type="text" id="user-input" 
                    placeholder="Upload logs to train, then type here..."
                    class="w-full pl-16 pr-32 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 text-sm shadow-inner">
                
                <button onclick="handleSend()" 
                    class="absolute right-2 bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 active:scale-95 transition-all shadow-md shadow-indigo-100">
                    Send
                </button>
            </div>
        </div>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const messageList = document.getElementById('message-list');
        const userInput = document.getElementById('user-input');
        const filePreview = document.getElementById('file-preview');
        const fileNameSpan = document.getElementById('file-name');
        const fileSizeSpan = document.getElementById('file-size');
        
        let attachedFile = null;
        let isEngineTrained = false;

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                attachedFile = file;
                fileNameSpan.textContent = file.name;
                fileSizeSpan.textContent = (file.size / 1024).toFixed(1) + ' KB';
                filePreview.classList.remove('hidden');
                addMessage('assistant', `Target file detected: **${file.name}**. Press Send to initialize the persona engine.`);
            }
        }

        function clearFile() {
            attachedFile = null;
            filePreview.classList.add('hidden');
            document.getElementById('file-input').value = '';
        }

        async function handleSend() {
            const content = userInput.value.trim();
            
            // --- STEP 1: TRAINING MODE ---
            if (attachedFile && !isEngineTrained) {
                addMessage('user', `Training Engine on: ${attachedFile.name}`);
                
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const textContent = e.target.result;
                    try {
                        const response = await fetch('/train', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                training_text: textContent,
                                examples: [] // You can add few-shot UI later
                            })
                        });
                        const data = await response.json();
                        isEngineTrained = true;
                        addMessage('assistant', "✅ **Engine Active.** Linguistic fingerprint captured. I am now mimicking the persona from your logs.");
                        clearFile();
                    } catch (err) {
                        addMessage('assistant', "❌ Error during training. Check backend logs.");
                    }
                };
                reader.readAsText(attachedFile);
                return;
            }

            // --- STEP 2: CHAT MODE ---
            if (!content) return;
            addMessage('user', content);
            userInput.value = '';

            if (!isEngineTrained) {
                setTimeout(() => {
                    addMessage('assistant', "⚠️ Please upload a .txt file of chat logs first so I can learn the persona!");
                }, 500);
                return;
            }

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: content })
                });
                const data = await response.json();
                addMessage('assistant', data.reply);
            } catch (error) {
                addMessage('assistant', "Error: Could not reach the Mimicry Engine.");
            }
        }

        function addMessage(role, text) {
            const isUser = role === 'user';
            const messageDiv = document.createElement('div');
            // Alternate sides based on message count
            const isRight = messageList.children.length % 2 === 1;
            
            messageDiv.className = `flex gap-5 animate-msg ${isRight ? 'flex-row-reverse' : ''}`;
            
            const borderCol = isUser ? 'border-l-indigo-500' : 'border-l-emerald-500';
            const textCol = isUser ? 'text-indigo-600' : 'text-emerald-500';
            
            messageDiv.innerHTML = `
                <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl border border-slate-200 bg-white shadow-sm">
                    <span class="text-xl font-black ${textCol}">${isUser ? 'U' : 'M'}</span>
                </div>
                <div class="flex-1 flex flex-col ${isRight ? 'items-end text-right' : 'items-start text-left'}">
                    <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden border-l-4 ${borderCol}">
                        <div class="px-6 py-5">
                            <p class="text-sm leading-relaxed text-slate-700 font-medium whitespace-pre-wrap">${text}</p>
                        </div>
                    </div>
                </div>
            `;
            
            messageList.appendChild(messageDiv);
            document.getElementById('chat-window').scrollTo({ top: messageList.scrollHeight, behavior: 'smooth' });
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Initial Greeting
        addMessage('assistant', "Mimicry Engine Online. Please upload data (.txt) to begin training my personality matrix.");
    </script>
</body>
</html>
