<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona AI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-msg { animation: slideUp 0.3s ease-out forwards; }
        .view-transition { transition: all 0.3s ease-in-out; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#f0f2f5] font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 p-4 shadow-sm flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i data-lucide="bot" class="w-5 h-5 text-white"></i>
            </div>
            <h1 class="font-bold text-slate-800 tracking-tight" id="header-title">Persona AI</h1>
        </div>
        <button onclick="location.reload()" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-1 transition-colors">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Reset Session
        </button>
    </header>

    <main id="main-container" class="flex-1 overflow-y-auto p-6 md:p-12">
        
        <div id="view-landing" class="max-w-2xl mx-auto space-y-8 py-12 text-center animate-msg">
            <div class="space-y-2">
                <h2 class="text-3xl font-black text-slate-900">Welcome to Persona AI</h2>
                <p class="text-slate-500">Select an existing personality or train a custom one from your own data.</p>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <button onclick="showPrebuilt()" class="group p-8 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md hover:border-indigo-500 transition-all text-left">
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center mb-4 group-hover:bg-indigo-600 transition-colors">
                        <i data-lucide="users" class="w-6 h-6 text-indigo-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="font-bold text-slate-800 text-lg">Prebuilt Persona</h3>
                    <p class="text-sm text-slate-500 mt-1">Choose from a library of verified AI personalities.</p>
                </button>
                
                <button onclick="showCustom()" class="group p-8 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-500 transition-all text-left">
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center mb-4 group-hover:bg-emerald-600 transition-colors">
                        <i data-lucide="cpu" class="w-6 h-6 text-emerald-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="font-bold text-slate-800 text-lg">Custom Persona</h3>
                    <p class="text-sm text-slate-500 mt-1">Train an AI on specific dialogue patterns or texts.</p>
                </button>
            </div>
        </div>

        <div id="view-prebuilt" class="max-w-4xl mx-auto hidden animate-msg">
            <button onclick="showLanding()" class="mb-6 text-sm font-medium text-slate-400 hover:text-indigo-600 flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Select a Persona</h2>
            <div id="persona-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                </div>
        </div>

        <div id="view-custom" class="max-w-3xl mx-auto hidden animate-msg">
            <button onclick="showLanding()" class="mb-6 text-sm font-medium text-slate-400 hover:text-indigo-600 flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-8 border-b border-slate-100">
                    <h2 class="text-2xl font-bold text-slate-800">Train Custom Persona</h2>
                    <p class="text-sm text-slate-500 mt-1">Provide background text and example interactions.</p>
                </div>
                <div class="p-8 space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Training Context / Personality</label>
                        <textarea id="train-text" rows="5" placeholder="Paste Discord logs, character descriptions, or dialogue style here..." 
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none text-sm transition-all"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Few-Shot Examples</label>
                        <div id="examples-list" class="space-y-3">
                            <div class="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                <input type="text" placeholder="User prompt..." class="ex-in p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none">
                                <input type="text" placeholder="AI response..." class="ex-out p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none">
                            </div>
                        </div>
                        <button onclick="addExampleRow()" class="mt-3 text-xs font-bold text-indigo-600 hover:text-indigo-700 flex items-center gap-1">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Another Example
                        </button>
                    </div>

                    <button id="btn-train" onclick="handleTrain()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100 flex justify-center items-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4"></i> Start Training
                    </button>
                </div>
            </div>
        </div>

        <div id="view-chat" class="max-w-4xl mx-auto hidden flex flex-col h-full space-y-6">
            <div id="message-list" class="space-y-6 pb-32">
                </div>
        </div>
    </main>

    <footer id="chat-footer" class="bg-white border-t border-slate-200 p-8 shadow-2xl relative hidden">
        <div class="max-w-4xl mx-auto">
            <div class="relative flex items-center gap-3">
                <input type="text" id="user-input" 
                    placeholder="Message persona..."
                    class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 text-sm shadow-inner">
                
                <button onclick="handleSend()" 
                    class="absolute right-2 bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 active:scale-95 transition-all shadow-md shadow-indigo-100">
                    Send
                </button>
            </div>
        </div>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Environment-agnostic API Base Routing
        const API_BASE = window.location.hostname === "huggingface.co" || window.location.hostname.endsWith(".hf.space") ? "" : window.location.origin;
        const views = ['landing', 'prebuilt', 'custom', 'chat'];
        
        // Single Page Navigation Utility
        function switchView(viewName) {
            views.forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            
            const footer = document.getElementById('chat-footer');
            viewName === 'chat' ? footer.classList.remove('hidden') : footer.classList.add('hidden');
        }

        function showLanding() { switchView('landing'); }

        // --- View Handlers ---

        // 1. Prebuilt Personas Fetching & Injection
        async function showPrebuilt() {
            switchView('prebuilt');
            const grid = document.getElementById('persona-grid');
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Loading personas...</div>`;

            try {
                const res = await fetch(`${API_BASE}/personas`);
                const data = await res.json();
                const personas = data.personas;
                
                grid.innerHTML = '';
                personas.forEach(name => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 border border-slate-200 rounded-xl hover:border-indigo-500 cursor-pointer transition-all hover:shadow-sm group";
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center group-hover:bg-indigo-50 text-slate-400 group-hover:text-indigo-600">
                                <i data-lucide="user"></i>
                            </div>
                            <span class="font-bold text-slate-700">${name}</span>
                        </div>
                    `;
                    card.onclick = () => loadPersona(name);
                    grid.appendChild(card);
                });
                lucide.createIcons();
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-red-500 text-center">Failed to connect to backend.</div>`;
            }
        }

        async function loadPersona(name) {
            try {
                const res = await fetch(`${API_BASE}/load-persona`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name }) // Pass name inside JSON body
                });
        
                const data = await res.json();
        
                if (res.ok) {
                    initChat(name);
                } else {
            // This alert will now catch and print the exact error message your backend throws!
                    alert("Backend Error: " + (data.message || "Failed to load template configuration."));
                }
          } catch (err) { 
                alert("Network connectivity error loading persona profile."); 
          }
        }


        // 2. Custom Persona Training Utilities
        function showCustom() { switchView('custom'); }

        function addExampleRow() {
            const container = document.getElementById('examples-list');
            const div = document.createElement('div');
            div.className = "grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-dashed border-slate-300 animate-msg";
            div.innerHTML = `
                <input type="text" placeholder="User prompt..." class="ex-in p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none">
                <input type="text" placeholder="AI response..." class="ex-out p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none">
            `;
            container.appendChild(div);
        }

        async function handleTrain() {
            const btn = document.getElementById('btn-train');
            const training_text = document.getElementById('train-text').value;
            const ins = document.querySelectorAll('.ex-in');
            const outs = document.querySelectorAll('.ex-out');
            
            const examples = [];
            ins.forEach((input, i) => {
                if (input.value && outs[i].value) {
                    examples.push({ input: input.value, output: outs[i].value });
                }
            });

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Training...`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_BASE}/train`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ training_text, examples })
                });
                if (res.ok) {
                    initChat("Custom Persona");
                } else {
                    alert("Training failed");
                }
            } catch (err) {
                alert("Connection error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i> Start Training`;
                lucide.createIcons();
            }
        }

        // 3. Chat Initialization & Message Dispatch loop
        function initChat(name) {
            document.getElementById('header-title').innerText = `Chatting: ${name}`;
            switchView('chat');
            addMessage('assistant', `Persona loaded successfully. I am ready for interaction.`);
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMessage('assistant', data.reply || "No response received.");
            } catch (err) {
                addMessage('assistant', "Error: Failed to reach the persona.");
            }
        }

        function addMessage(role, text) {
            const list = document.getElementById('message-list');
            const isUser = role === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-5 animate-msg ${isUser ? 'flex-row-reverse' : ''}`;
            
            const borderCol = isUser ? 'border-l-indigo-500' : 'border-l-emerald-500';
            const textCol = isUser ? 'text-indigo-600' : 'text-emerald-500';

            messageDiv.innerHTML = `
                <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl border border-slate-200 shadow-sm bg-white">
                    <span class="text-xl font-black ${textCol}">${isUser ? 'U' : 'P'}</span>
                </div>
                <div class="flex-1 flex flex-col ${isUser ? 'items-end text-right' : 'items-start text-left'}">
                    <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden border-l-4 ${borderCol}">
                        <div class="px-6 py-5">
                            <p class="text-sm leading-relaxed text-slate-700 font-medium whitespace-pre-wrap">${text}</p>
                        </div>
                    </div>
                </div>
            `;
            
            list.appendChild(messageDiv);
            const win = document.getElementById('main-container');
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        }

        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
